
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Ninja Strike</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none; /* Prevent browser refreshing on swipe */
            user-select: none;
        }

        .font-title {
            font-family: 'Cinzel', serif;
        }

        /* Seamless Fullscreen Video Layer with Top Crop */
        .video-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 110vh; /* Zooms 10% outwards pushing past the top boundary */
            overflow: hidden;
            z-index: 10;
            background-color: #000;
        }

        .video-layer video, #ytPlayerContainer iframe {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* Maintains left/right/bottom tight fill */
            border: none;
            outline: none;
            pointer-events: none; /* Prevents user interacting with YouTube/Video UI */
        }

        /* Clean transparent dialog */
        .transparent-dialog {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Subtle pulsing text for tap indicator */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        /* Slider Thumb styling */
        #slider-thumb {
            transition: transform 0.1s;
        }
        #slider-thumb.snapping {
            transition: left 0.3s ease-out, transform 0.3s ease-out;
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- PHASE 1: STORY DIALOGUE SCREEN -->
    <!-- The entire screen is clickable to advance the story -->
    <div id="storyScreen" class="absolute inset-0 z-30 flex flex-col justify-end bg-cover bg-center bg-no-repeat cursor-pointer transition-opacity duration-700" 
         style="background-image: url('https://res.cloudinary.com/dsqi4tm8x/image/upload/v1790269644/2fea2de11dc79970adf05c7a86a1ab97_armfj4.jpg');">
        
        <!-- Subtle gradient for text readability -->
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent pointer-events-none"></div>

        <!-- Transparent Dialog Box (No Borders) -->
        <div class="relative z-10 w-full px-6 pb-12 pt-6 transparent-dialog">
            <div class="max-w-3xl mx-auto text-center">
                <h3 id="dialogSpeaker" class="font-title font-bold text-red-400 text-lg tracking-widest uppercase mb-2">Narrator</h3>
                <p id="dialogText" class="text-white text-xl md:text-2xl leading-relaxed min-h-[90px] drop-shadow-md">
                    <!-- Text injected via JS -->
                </p>
                
                <!-- Tap Indicator -->
                <p class="text-xs text-gray-400 tracking-widest uppercase mt-6 animate-pulse-soft">
                    Tap anywhere to continue
                </p>
            </div>
        </div>
    </div>

    <!-- PHASE 2: FULLSCREEN VIDEO PLAYER (HTML5 & YT) -->
    <div id="videoScreen" class="absolute inset-0 z-20 hidden bg-black">
        <div class="video-layer">
            <!-- HTML5 Video for 1.0 and 1.1 -->
            <video id="mainVideo" playsinline preload="auto"></video>
            
            <!-- YouTube Player Container for 1.2 -->
            <div id="ytPlayerContainer" class="hidden w-full h-full absolute inset-0">
                <div id="ytPlayer"></div>
            </div>
        </div>
        
        <!-- Hidden skip instruction, shown only if autoplay is blocked -->
        <div id="playPrompt" class="absolute inset-0 z-30 hidden flex items-center justify-center bg-black/80 cursor-pointer">
            <p class="text-white font-title text-xl tracking-widest animate-pulse-soft">Tap to Start Video</p>
        </div>
    </div>

    <!-- PHASE 3: ELEMENTAL POWER SLIDER OVERLAY -->
    <div id="powerChoiceScreen" class="absolute inset-x-0 z-40 hidden flex-col items-center pointer-events-none" style="bottom: 20%;">
        
        <!-- Interactive Drag Slider -->
        <div class="relative w-full max-w-md h-20 bg-white/10 backdrop-blur-md rounded-full shadow-lg overflow-hidden flex items-center border border-white/20 pointer-events-auto">
            
            <!-- Target Labels -->
            <div class="absolute left-6 text-red-500 font-title font-bold tracking-widest opacity-80 drop-shadow-md">FIRE</div>
            <div class="absolute right-6 text-cyan-500 font-title font-bold tracking-widest opacity-80 drop-shadow-md">ELECTRIC</div>
            
            <!-- Draggable Thumb -->
            <div id="slider-thumb" class="absolute w-20 h-20 bg-white rounded-full shadow-[0_0_20px_rgba(255,255,255,0.5)] flex items-center justify-center cursor-grab snapping" style="left: 50%; transform: translateX(-50%);">
                <div class="w-12 h-12 rounded-full bg-black/10"></div>
            </div>
            
        </div>
    </div>

    <script>
        // Media Configuration
        const bgImage = 'https://res.cloudinary.com/dsqi4tm8x/image/upload/v1790269644/2fea2de11dc79970adf05c7a86a1ab97_armfj4.jpg';
        
        // Extracted raw .mp4 URLs for perfect fullscreen, borderless playback
        const video1_0 = 'https://res.cloudinary.com/dsqi4tm8x/video/upload/1.0_edoutw.mp4';
        const video1_1 = 'https://res.cloudinary.com/dsqi4tm8x/video/upload/1.1_b4lyr8.mp4';

        // YouTube Video IDs for 1.2
        const ytFireId = 'F4FEpI-0tzI';
        const ytElectricId = 'VXtbzPW48G0';

        // YouTube API Initialization
        let ytPlayerInstance;
        let isYtReady = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            ytPlayerInstance = new YT.Player('ytPlayer', {
                playerVars: {
                    'controls': 0,        // No UI controls
                    'disablekb': 1,       // No keyboard shortcuts
                    'modestbranding': 1,  // Minimal branding
                    'rel': 0,             // No related videos at end
                    'showinfo': 0,
                    'playsinline': 1,
                    'autoplay': 0,
                    'iv_load_policy': 3   // No annotations
                },
                events: {
                    'onReady': () => { isYtReady = true; }
                }
            });
        };

        // English Story Dialogues
        const storyDialogues = [
            { speaker: "Narrator", text: "Evil shadow ninjas have emerged from the darkness..." },
            { speaker: "Villager", text: "They are terrorizing the innocent and burning everything in their path!" },
            { speaker: "Hero", text: "I must awaken the ancient elemental powers to stop this madness." }
        ];

        let currentStoryIndex = 0;
        let currentVideoPhase = ''; // tracks which video is playing

        // DOM Elements
        const storyScreen = document.getElementById('storyScreen');
        const dialogSpeaker = document.getElementById('dialogSpeaker');
        const dialogText = document.getElementById('dialogText');
        const videoScreen = document.getElementById('videoScreen');
        const mainVideo = document.getElementById('mainVideo');
        const playPrompt = document.getElementById('playPrompt');
        const powerChoiceScreen = document.getElementById('powerChoiceScreen');

        function updateDialogue() {
            const dialogue = storyDialogues[currentStoryIndex];
            dialogSpeaker.innerText = dialogue.speaker;
            dialogText.innerText = dialogue.text;
        }

        // Tap anywhere on the story screen to advance
        storyScreen.addEventListener('click', () => {
            currentStoryIndex++;
            if (currentStoryIndex < storyDialogues.length) {
                updateDialogue();
            } else {
                // End of story, start Video 1.0
                storyScreen.classList.add('opacity-0');
                setTimeout(() => {
                    storyScreen.classList.add('hidden');
                    playVideo('1.0');
                }, 700);
            }
        });

        // Initialize first dialog
        updateDialogue();

        function playVideo(phase) {
            videoScreen.classList.remove('hidden');
            currentVideoPhase = phase;
            
            // Ensure HTML5 video is visible, hide YT player
            mainVideo.classList.remove('hidden');
            document.getElementById('ytPlayerContainer').classList.add('hidden');

            // Assign corresponding video source
            if (phase === '1.0') {
                mainVideo.src = video1_0;
            } else if (phase === '1.1') {
                mainVideo.src = video1_1;
            }

            // Attempt Autoplay
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Autoplay prevented by browser, show prompt
                    playPrompt.classList.remove('hidden');
                });
            }
        }

        // Handle manual play if autoplay is blocked
        playPrompt.addEventListener('click', () => {
            playPrompt.classList.add('hidden');
            mainVideo.play();
        });

        // Listen for video completion seamlessly
        mainVideo.addEventListener('ended', () => {
            if (currentVideoPhase === '1.0') {
                playVideo('1.1');
            } else if (currentVideoPhase === '1.1') {
                // Keep the 1.1 video frozen in background, show slider overlay
                powerChoiceScreen.classList.remove('hidden');
                powerChoiceScreen.classList.add('flex'); // Ensure flex is active for alignment
                resetSlider();
            }
        });

        const sliderContainer = powerChoiceScreen.querySelector('.max-w-md');
        const sliderThumb = document.getElementById('slider-thumb');
        
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let containerWidth = 0;

        function resetSlider() {
            sliderThumb.style.left = '50%';
            sliderThumb.style.backgroundColor = '#ffffff';
            sliderThumb.style.boxShadow = '0 0 20px rgba(255,255,255,0.5)';
        }

        function handleDragStart(e) {
            isDragging = true;
            sliderThumb.classList.remove('snapping');
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            containerWidth = sliderContainer.offsetWidth;
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const deltaX = clientX - startX;
            
            // Calculate percentage position (0 to 100)
            let percent = 50 + ((deltaX / containerWidth) * 100);
            percent = Math.max(10, Math.min(90, percent)); // Clamp between 10% and 90%
            
            sliderThumb.style.left = `${percent}%`;

            // Dynamic color feedback based on direction
            if (percent < 40) {
                sliderThumb.style.backgroundColor = '#ef4444'; // Red for Fire
                sliderThumb.style.boxShadow = '0 0 30px rgba(239,68,68,0.8)';
            } else if (percent > 60) {
                sliderThumb.style.backgroundColor = '#06b6d4'; // Cyan for Electric
                sliderThumb.style.boxShadow = '0 0 30px rgba(6,182,212,0.8)';
            } else {
                sliderThumb.style.backgroundColor = '#ffffff';
                sliderThumb.style.boxShadow = '0 0 20px rgba(255,255,255,0.5)';
            }
            
            currentX = percent;
        }

        function handleDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            sliderThumb.classList.add('snapping');
            
            // Check selection threshold
            if (currentX <= 20) {
                selectPower('fire');
            } else if (currentX >= 80) {
                selectPower('electric');
            } else {
                // Snap back to center
                resetSlider();
            }
        }

        function selectPower(type) {
            // Hide slider UI
            powerChoiceScreen.classList.add('hidden');
            powerChoiceScreen.classList.remove('flex');
            
            // Switch from HTML5 video layer to YouTube layer
            mainVideo.classList.add('hidden');
            document.getElementById('ytPlayerContainer').classList.remove('hidden');

            const targetVideoId = type === 'fire' ? ytFireId : ytElectricId;

            // Play via YouTube API
            if (isYtReady && ytPlayerInstance) {
                ytPlayerInstance.loadVideoById(targetVideoId);
                ytPlayerInstance.playVideo();
            } else {
                // Fallback loop if YouTube API loaded slowly
                const retryPlay = setInterval(() => {
                    if (isYtReady && ytPlayerInstance) {
                        ytPlayerInstance.loadVideoById(targetVideoId);
                        ytPlayerInstance.playVideo();
                        clearInterval(retryPlay);
                    }
                }, 500);
            }
        }

        // Attach Slider Events (Touch & Mouse)
        sliderThumb.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);

        sliderThumb.addEventListener('touchstart', handleDragStart, { passive: false });
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);

    </script>
</body>
</html>
