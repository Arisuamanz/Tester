
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permainan Video Latar Belakang - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }

        /* --- STYLING VIDEO BACKGROUND YANG DIPERBAIKI --- */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Lapisan Paling Bawah */
            pointer-events: none; /* Klik tembus ke game */
            overflow: hidden;
        }

        /* Trik CSS untuk memastikan iframe YouTube memenuhi skrin (stretch/fill) */
        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            /* Memaksa skala iframe membesar untuk membuang bar hitam tepi */
            min-width: 100%;
            min-height: 100%;
            /* Guna nisbah aspek 16:9 sebagai panduan minima */
            width: max(100vw, 177.78vh); 
            height: max(100vh, 56.25vw);
            object-fit: cover;
        }

        /* --- STYLING LAPISAN PERMAINAN --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4); /* Gelapkan sikit video untuk nampak game */
            z-index: 2; /* Atas video */
            pointer-events: none;
        }

        .game-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10; /* Atas segalanya */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background-color: transparent;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            /* Sempadan kaca */
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="text-white select-none font-sans">

    <!-- 1. LATAR BELAKANG VIDEO YOUTUBE -->
    <div class="video-container" id="video-wrapper">
        <div id="youtube-player"></div>
    </div>

    <!-- 2. OVERLAY (Kesan Gelap) -->
    <div class="overlay"></div>

    <!-- 3. LAPISAN PERMAINAN (UI & CANVAS) -->
    <div class="game-layer">
        
        <!-- UI Skor Semasa Bermain -->
        <div id="ui-score" class="absolute top-8 left-8 hidden bg-black/50 p-4 rounded-xl backdrop-blur-sm border border-white/10">
            <p class="text-xs text-gray-300 font-bold tracking-wider uppercase">Markah</p>
            <p id="score-display" class="text-4xl font-black text-emerald-400">0</p>
        </div>

        <!-- Kanvas Game -->
        <canvas id="gameCanvas" class="hidden w-[90vw] h-[70vh] max-w-[400px] max-h-[600px]"></canvas>

        <!-- Menu Utama (Mula) -->
        <div id="menu-start" class="flex flex-col items-center bg-black/80 p-8 rounded-3xl border border-white/10 backdrop-blur-md shadow-2xl text-center max-w-sm w-[90%]">
            <h1 class="text-3xl font-black mb-2 bg-gradient-to-r from-emerald-400 to-cyan-400 text-transparent bg-clip-text">NEON DODGE</h1>
            <p class="text-sm text-gray-400 mb-8">Elak kotak merah jambu! Video akan dimainkan di latar belakang.</p>
            
            <button onclick="startGame()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold rounded-full transition-transform active:scale-95 shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                ▶ MULA & MAIN VIDEO
            </button>
            <p id="loading-msg" class="text-xs text-yellow-400 mt-4 hidden">Memuatkan Pemain Video...</p>
        </div>

        <!-- Menu Tamat (Game Over) -->
        <div id="menu-gameover" class="hidden flex-col items-center bg-black/90 p-8 rounded-3xl border border-red-500/30 backdrop-blur-md shadow-[0_0_30px_rgba(239,68,68,0.3)] text-center max-w-sm w-[90%]">
            <h2 class="text-3xl font-black text-red-500 mb-2 uppercase">Kecundang!</h2>
            <p class="text-gray-300 mb-6">Markah Akhir Anda:<br><span id="final-score" class="text-5xl font-black text-white block mt-2">0</span></p>
            
            <button onclick="restartGame()" class="w-full py-4 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white font-extrabold rounded-full transition-transform active:scale-95 shadow-lg">
                ↺ CUBA LAGI
            </button>
        </div>

        <!-- Kawalan Sentuhan Mudah Alih -->
        <div id="mobile-controls" class="hidden absolute bottom-8 left-0 w-full flex justify-between px-8 z-50">
            <button id="btn-left" class="w-20 h-20 bg-white/10 rounded-full border border-white/20 active:bg-white/30 backdrop-blur-sm text-3xl flex items-center justify-center">⬅</button>
            <button id="btn-right" class="w-20 h-20 bg-white/10 rounded-full border border-white/20 active:bg-white/30 backdrop-blur-sm text-3xl flex items-center justify-center">➡</button>
        </div>
    </div>

    <!-- MUAT TURUN YOUTUBE IFRAME API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // ==========================================
        // 1. PENGURUSAN YOUTUBE IFRAME API
        // ==========================================
        let player;
        let isVideoReady = false;
        const videoId = 'wMONY5W8sZQ'; // ID Video yang diminta

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 0,        // Jangan auto-play dulu, tunggu klik
                    'controls': 0,        // Buang butang pause/play
                    'disablekb': 1,       // Buang kawalan keyboard YT
                    'fs': 0,              // Tiada fullscreen butang
                    'rel': 0,             // Tiada video berkaitan
                    'showinfo': 0,        // Tiada tajuk
                    'modestbranding': 1,  // Tiada logo
                    'playsinline': 1,     // Penting untuk mobile ios
                    'loop': 1,
                    'playlist': videoId   // Wajib ada untuk loop
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isVideoReady = true;
            console.log("YouTube API Sedia");
        }

        function onPlayerStateChange(event) {
            // Jika video tamat (walaupun loop), cuba paksa main semula
            if (event.data === YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }

        // ==========================================
        // 2. ENJIN PERMAINAN HTML5 CANVAS
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoop;
        let score = 0;
        let gameActive = false;
        let difficultyMultiplier = 1;

        // Tetapkan saiz rasmi kanvas dalaman
        canvas.width = 400;
        canvas.height = 600;

        // Objek Pemain
        const hero = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 70,
            w: 40,
            h: 40,
            speed: 8,
            dx: 0,
            color: '#10B981' // Emerald
        };

        let enemies = [];
        let particles = [];

        // Fungsi melukis pemain
        function drawHero() {
            ctx.fillStyle = hero.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = hero.color;
            ctx.beginPath();
            ctx.roundRect(hero.x, hero.y, hero.w, hero.h, 8); // Kotak bucu bulat
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Fungsi mencipta musuh
        function spawnEnemy() {
            let size = Math.random() * 30 + 20;
            let xPos = Math.random() * (canvas.width - size);
            enemies.push({
                x: xPos,
                y: -size,
                w: size,
                h: size,
                speed: (Math.random() * 3 + 3) * difficultyMultiplier,
                color: '#EC4899' // Pink/Magenta
            });
        }

        // Fungsi melukis musuh
        function drawEnemies() {
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = e.color;
                ctx.beginPath();
                ctx.moveTo(e.x + e.w/2, e.y);
                ctx.lineTo(e.x + e.w, e.y + e.h);
                ctx.lineTo(e.x, e.y + e.h);
                ctx.fill(); // Bentuk Segitiga
                ctx.shadowBlur = 0;
            });
        }

        // Kitaran Utama Game
        function update() {
            if (!gameActive) return;

            // Clear frame sebelumnya
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gerakkan Pemain
            hero.x += hero.dx;
            
            // Halang pemain keluar skrin
            if (hero.x < 0) hero.x = 0;
            if (hero.x + hero.w > canvas.width) hero.x = canvas.width - hero.w;

            drawHero();

            // Tambah musuh secara rawak
            if (Math.random() < 0.04 * difficultyMultiplier) {
                spawnEnemy();
            }

            // Gerakkan dan urus musuh
            for (let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                e.y += e.speed;

                // Pelanggaran (Collision)
                if (
                    hero.x < e.x + e.w &&
                    hero.x + hero.w > e.x &&
                    hero.y < e.y + e.h &&
                    hero.y + hero.h > e.y
                ) {
                    gameOver();
                    return;
                }

                // Kira Markah jika musuh melepasi bawah skrin
                if (e.y > canvas.height) {
                    score += 10;
                    document.getElementById('score-display').innerText = score;
                    enemies.splice(i, 1);
                    i--;
                    
                    // Tingkatkan kesukaran sedikit demi sedikit
                    if (score % 100 === 0) difficultyMultiplier += 0.1;
                }
            }

            drawEnemies();
            gameLoop = requestAnimationFrame(update);
        }

        // ==========================================
        // 3. KAWALAN PEMAIN (KEYBOARD & TOUCH)
        // ==========================================
        
        // Keyboard (PC)
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a') hero.dx = -hero.speed;
            if(e.key === 'ArrowRight' || e.key === 'd') hero.dx = hero.speed;
        });
        window.addEventListener('keyup', (e) => {
            if(['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) hero.dx = 0;
        });

        // Butang Sentuh (Mobile)
        const btnL = document.getElementById('btn-left');
        const btnR = document.getElementById('btn-right');

        // Guna touchstart/end supaya lebih responsif di mobile
        btnL.addEventListener('touchstart', (e) => { e.preventDefault(); hero.dx = -hero.speed; });
        btnL.addEventListener('touchend', (e) => { e.preventDefault(); hero.dx = 0; });
        btnL.addEventListener('mousedown', () => hero.dx = -hero.speed);
        btnL.addEventListener('mouseup', () => hero.dx = 0);
        btnL.addEventListener('mouseleave', () => hero.dx = 0);

        btnR.addEventListener('touchstart', (e) => { e.preventDefault(); hero.dx = hero.speed; });
        btnR.addEventListener('touchend', (e) => { e.preventDefault(); hero.dx = 0; });
        btnR.addEventListener('mousedown', () => hero.dx = hero.speed);
        btnR.addEventListener('mouseup', () => hero.dx = 0);
        btnR.addEventListener('mouseleave', () => hero.dx = 0);


        // ==========================================
        // 4. KAWALAN MENU & INTEGRASI VIDEO
        // ==========================================
        function startGame() {
            if (!isVideoReady) {
                document.getElementById('loading-msg').classList.remove('hidden');
                setTimeout(startGame, 500); // Cuba lagi dalam 0.5s
                return;
            }

            // Minta Fullscreen untuk peranti (Pilihan)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch((err)=>{console.log("Fullscreen dihalang")});
            }

            // Mula mainkan video YouTube
            if (player && typeof player.playVideo === 'function') {
                player.unMute(); // Buka bunyi jika mahu
                player.playVideo();
            }

            // Kemas kini UI Menu
            document.getElementById('menu-start').classList.add('hidden');
            document.getElementById('gameCanvas').classList.remove('hidden');
            document.getElementById('ui-score').classList.remove('hidden');
            
            // Paparkan kawalan mobile jika peranti skrin sentuh
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            }

            // Reset status game
            resetGame();
            gameActive = true;
            update();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(gameLoop);
            
            // Kemas kini UI Game Over
            document.getElementById('gameCanvas').classList.add('hidden');
            document.getElementById('ui-score').classList.add('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('menu-gameover').classList.remove('hidden');
            document.getElementById('menu-gameover').classList.add('flex');
        }

        function restartGame() {
            document.getElementById('menu-gameover').classList.add('hidden');
            document.getElementById('menu-gameover').classList.remove('flex');
            
            document.getElementById('gameCanvas').classList.remove('hidden');
            document.getElementById('ui-score').classList.remove('hidden');
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            }

            resetGame();
            gameActive = true;
            update();
        }

        function resetGame() {
            score = 0;
            difficultyMultiplier = 1;
            enemies = [];
            hero.x = canvas.width / 2 - 20;
            hero.dx = 0;
            document.getElementById('score-display').innerText = score;
        }

    </script>
</body>
</html>
