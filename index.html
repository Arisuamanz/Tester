
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Tembak Susu - Redesign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none; /* Halang scroll ketika bermain */
        }

        /* --- VIDEO BACKGROUND --- */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; 
            pointer-events: none; 
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: max(100vw, 177.78vh); 
            height: max(100vh, 56.25vw);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* --- OVERLAY SANGAT NIPIS (Hanya untuk timbulkan susu putih) --- */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15); /* 15% gelap sahaja */
            z-index: 2;
            pointer-events: none;
        }

        /* --- KANVAS GAME BORDERLESS --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: block; /* Buang jarak bawah default */
        }

        /* --- UI TANPA BINGKAI (TEXT ONLY) --- */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none; /* Biar klik tembus ke canvas */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Teks dengan bayang-bayang supaya nampak jelas tanpa kotak */
        .text-shadow-glow {
            text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.3);
        }
        
        .pointer-events-auto {
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-white select-none font-sans">

    <!-- 1. VIDEO YOUTUBE LATAR -->
    <div class="video-container">
        <div id="youtube-player"></div>
    </div>
    <div class="overlay"></div>

    <!-- 2. KANVAS SKRIN PENUH -->
    <canvas id="gameCanvas"></canvas>

    <!-- 3. UI TANPA KOTAK (Bebas halangan visual) -->
    <div class="ui-layer">
        
        <!-- Skor (Kiri Atas) -->
        <div id="score-ui" class="absolute top-6 left-6 hidden text-left">
            <p class="text-[12px] font-bold tracking-widest uppercase text-white/80 text-shadow-glow">Skor Cecair</p>
            <p id="score-display" class="text-5xl font-black text-white text-shadow-glow mt-[-5px]">0</p>
        </div>

        <!-- Menu Mula -->
        <div id="menu-start" class="flex flex-col items-center pointer-events-auto text-center mt-[-10vh]">
            <h1 class="text-5xl md:text-7xl font-black mb-2 text-white text-shadow-glow uppercase tracking-tighter">Splash<br><span class="text-blue-300">Susu</span></h1>
            <p class="text-lg text-white/90 mb-10 text-shadow-glow font-medium">Tap skrin untuk tembak susu ke biskut!</p>
            
            <button onclick="startGame()" class="px-10 py-4 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white text-xl font-black rounded-full transition-all active:scale-90 border border-white/40 shadow-[0_0_30px_rgba(255,255,255,0.3)] cursor-pointer uppercase tracking-widest">
                Main Sekarang
            </button>
            <p id="loading-msg" class="text-sm text-yellow-300 mt-4 hidden text-shadow-glow">Menyambung Video...</p>
        </div>

        <!-- Menu Game Over -->
        <div id="menu-gameover" class="hidden flex-col items-center pointer-events-auto text-center">
            <h2 class="text-5xl md:text-6xl font-black text-red-500 text-shadow-glow uppercase mb-2">Tumpah!</h2>
            <p class="text-xl text-white/90 text-shadow-glow">Skor Anda:</p>
            <p id="final-score" class="text-7xl font-black text-white text-shadow-glow mb-10">0</p>
            
            <button onclick="restartGame()" class="px-10 py-4 bg-red-500/80 hover:bg-red-500 backdrop-blur-sm text-white text-xl font-black rounded-full transition-all active:scale-90 shadow-[0_0_30px_rgba(239,68,68,0.5)] cursor-pointer uppercase tracking-widest">
                Cuba Lagi
            </button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // ==========================================
        // 1. PENGURUSAN VIDEO YOUTUBE
        // ==========================================
        let ytPlayer;
        let isVideoReady = false;
        const videoId = 'wMONY5W8sZQ'; 

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'rel': 0, 
                    'showinfo': 0, 'modestbranding': 1, 'playsinline': 1, 'loop': 1,
                    'playlist': videoId, 'vq': 'hd1080'
                },
                events: {
                    'onReady': () => { isVideoReady = true; },
                    'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) ytPlayer.playVideo(); }
                }
            });
        }

        // ==========================================
        // 2. ENJIN KANVAS & KESAN VISUAL (FLUID/CECAIR)
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId;
        
        let score = 0;
        let gameActive = false;
        let frameCount = 0;

        // Jadikan canvas sepenuh skrin
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- ENTIITI PERMAINAN ---
        
        // Pemain (Muncung Tembakan di bawah)
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 40,
            targetX: canvas.width / 2,
            radius: 20
        };

        let milkDrops = [];
        let cookies = [];
        let splashes = []; // Kesan susu pecah (Cecair)

        // --- FUNGSI LUKISAN ---
        
        function drawPlayer() {
            // Pergerakan lancar (Smooth lerp) mengikut jari/mouse
            player.x += (player.targetX - player.x) * 0.2;

            // Lukis pemain sebagai muncung/meriam bulat biru cair/putih
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#93c5fd'; // Biru lembut
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Detail muncung
            ctx.fillStyle = '#60a5fa';
            ctx.beginPath();
            ctx.arc(player.x, player.y - 10, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawMilkDrops() {
            // Peluru berbentuk titisan susu memanjang
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
            
            milkDrops.forEach(drop => {
                ctx.beginPath();
                // Bentuk bujur (titisan cecair)
                ctx.ellipse(drop.x, drop.y, drop.width, drop.height, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function drawCookies() {
            cookies.forEach(cookie => {
                // Biskut asas
                ctx.fillStyle = '#8B4513'; // Warna Coklat
                ctx.beginPath();
                ctx.arc(cookie.x, cookie.y, cookie.radius, 0, Math.PI * 2);
                ctx.fill();

                // Cip Coklat (Kesan tekstur)
                ctx.fillStyle = '#3E2723'; // Coklat gelap
                ctx.beginPath();
                ctx.arc(cookie.x - cookie.radius*0.3, cookie.y - cookie.radius*0.2, cookie.radius*0.2, 0, Math.PI * 2);
                ctx.arc(cookie.x + cookie.radius*0.4, cookie.y + cookie.radius*0.1, cookie.radius*0.15, 0, Math.PI * 2);
                ctx.arc(cookie.x - cookie.radius*0.1, cookie.y + cookie.radius*0.4, cookie.radius*0.25, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSplashes() {
            // Visual cecair pecah yang terkesan dengan graviti
            splashes.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        // --- MEKANIK TEMBAKAN & KESAN CECAIR ---
        
        function shootMilk() {
            milkDrops.push({
                x: player.x,
                y: player.y - 20,
                width: 6,
                height: 18, // Bentuk memanjang macam pancutan
                speed: 15
            });
        }

        function createMilkSplash(x, y, amount) {
            for(let i=0; i<amount; i++) {
                splashes.push({
                    x: x, 
                    y: y,
                    vx: (Math.random() - 0.5) * 10, // Pecahan rawak kiri/kanan
                    vy: (Math.random() - 1) * 8,    // Pecahan ke atas sikit
                    radius: Math.random() * 6 + 2,  // Saiz cecair berbeza
                    alpha: 1,
                    gravity: 0.4                    // Efek cecair jatuh
                });
            }
        }

        function spawnCookie() {
            let r = Math.random() * 20 + 20; // Jejari biskut (20 - 40)
            cookies.push({
                x: Math.random() * (canvas.width - r * 2) + r,
                y: -r,
                radius: r,
                speed: Math.random() * 2.5 + 2 // Kelajuan jatuh
            });
        }

        // --- KITARAN UTAMA (GAME LOOP) ---
        
        function update() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Bersihkan tanpa latar!
            frameCount++;

            // 1. UPDATE PEMAIN
            drawPlayer();

            // 2. UPDATE PELURU SUSU
            for (let i = 0; i < milkDrops.length; i++) {
                let drop = milkDrops[i];
                drop.y -= drop.speed;
                // Susu jadi makin panjang bila laju
                drop.height = Math.min(drop.height + 0.5, 30); 
                
                if (drop.y < -50) {
                    milkDrops.splice(i, 1);
                    i--;
                }
            }
            drawMilkDrops();

            // 3. MUNCUL BISKUT (Musuh)
            // Makin lama main, makin cepat biskut keluar
            let spawnRate = Math.max(20, 60 - Math.floor(score / 50)); 
            if (frameCount % spawnRate === 0) spawnCookie();

            // 4. UPDATE BISKUT & COLLISION (Bulat bertemu bulat)
            for (let i = 0; i < cookies.length; i++) {
                let c = cookies[i];
                c.y += c.speed;

                // Cek Pelanggaran Biskut dengan Pemain (GAME OVER)
                let distToPlayer = Math.hypot(player.x - c.x, player.y - c.y);
                if (distToPlayer < player.radius + c.radius - 5) {
                    gameOver();
                    return;
                }

                // Cek Pelanggaran Susu dengan Biskut
                let hit = false;
                for (let j = 0; j < milkDrops.length; j++) {
                    let drop = milkDrops[j];
                    let distToDrop = Math.hypot(drop.x - c.x, drop.y - c.y);
                    
                    if (distToDrop < c.radius + drop.height/2) {
                        // KENA!
                        createMilkSplash(c.x, c.y, 15); // Hasilkan letupan cecair
                        score += 10;
                        document.getElementById('score-display').innerText = score;
                        
                        milkDrops.splice(j, 1); // Buang peluru susu
                        hit = true;
                        break;
                    }
                }

                // Buang biskut jika kena tembak atau terkeluar skrin
                if (hit || c.y > canvas.height + c.radius) {
                    cookies.splice(i, 1);
                    i--;
                }
            }
            drawCookies();

            // 5. UPDATE SPLASH (CECAIR PECAH)
            for (let i = 0; i < splashes.length; i++) {
                let s = splashes[i];
                s.vy += s.gravity; // Tarikan graviti (jatuh)
                s.x += s.vx;
                s.y += s.vy;
                s.radius *= 0.95; // Makin mengecil (menyejat)
                s.alpha -= 0.03;  // Makin pudar
                
                if (s.alpha <= 0.1 || s.radius <= 0.5) {
                    splashes.splice(i, 1);
                    i--;
                }
            }
            drawSplashes();

            gameLoopId = requestAnimationFrame(update);
        }

        // ==========================================
        // 3. KAWALAN SENTUHAN (TAP / MOUSE)
        // ==========================================
        
        function handleInput(e) {
            if (!gameActive) return;
            e.preventDefault(); // Halang scroll/zoom di mobile
            
            // Dapatkan koordinat X (Touch atau Mouse)
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            
            // Gerakkan pemain ke koordinat jari/mouse
            player.targetX = clientX;
            
            // Tembak susu setiap kali tap/klik!
            shootMilk();
        }

        function handleMove(e) {
            if (!gameActive) return;
            e.preventDefault();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.targetX = clientX; // Pemain ikut jari tanpa menembak
        }

        // Daftar event listener untuk Canvas (Bebas Kawalan)
        canvas.addEventListener('touchstart', handleInput, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('mousemove', (e) => {
            if(e.buttons > 0) handleMove(e); // Hanya ikut kalau sedang klik hold (drag)
        });

        // ==========================================
        // 4. KAWALAN MENU
        // ==========================================
        function startGame() {
            if (!isVideoReady) {
                document.getElementById('loading-msg').classList.remove('hidden');
                setTimeout(startGame, 500);
                return;
            }

            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.unMute(); 
                ytPlayer.playVideo();
            }

            // Sembunyikan Menu
            document.getElementById('menu-start').classList.add('hidden');
            document.getElementById('score-ui').classList.remove('hidden');

            resetGame();
            gameActive = true;
            resizeCanvas(); // Pastikan saiz penuh sebelum mula
            update();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(gameLoopId);
            
            document.getElementById('score-ui').classList.add('hidden');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('menu-gameover').classList.remove('hidden');
            document.getElementById('menu-gameover').classList.add('flex');
        }

        function restartGame() {
            document.getElementById('menu-gameover').classList.add('hidden');
            document.getElementById('menu-gameover').classList.remove('flex');
            document.getElementById('score-ui').classList.remove('hidden');

            resetGame();
            gameActive = true;
            update();
        }

        function resetGame() {
            score = 0;
            frameCount = 0;
            milkDrops = [];
            cookies = [];
            splashes = [];
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;
            document.getElementById('score-display').innerText = score;
        }
    </script>
</body>
</html>
