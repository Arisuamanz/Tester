<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Ninja Strike</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none; /* Prevent browser swipe gestures */
            user-select: none;
        }

        .font-title {
            font-family: 'Cinzel', serif;
        }

        /* Seamless Fullscreen Video Layer - Shifted up 10% */
        .video-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 10;
            background-color: #000;
            transform: translateY(-10%);
        }

        .video-layer video, #ytPlayerContainer iframe {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            border: none;
            outline: none;
            pointer-events: none;
        }

        /* Clean transparent dialog */
        .transparent-dialog {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* Subtle pulsing text for tap indicator */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        /* Dynamic Flame & Electric FX Animations for Slider Diamond */
        @keyframes fire-flare {
            0%, 100% { 
                transform: rotate(45deg) scale(1.05); 
                box-shadow: 0 0 25px #ef4444, 0 0 50px #f97316, 0 0 80px #dc2626, inset 0 0 15px #fde047;
            }
            50% { 
                transform: rotate(45deg) scale(1.22); 
                box-shadow: 0 0 40px #dc2626, 0 0 75px #ea580c, 0 0 110px #b91c1c, inset 0 0 25px #ffffff;
            }
        }

        @keyframes electric-zap {
            0%, 100% { 
                transform: rotate(45deg) scale(1.05) translate(0, 0); 
                box-shadow: 0 0 25px #06b6d4, 0 0 50px #3b82f6, 0 0 80px #0284c7, inset 0 0 15px #e0f2fe;
            }
            25% { transform: rotate(45deg) scale(1.15) translate(-1px, 1px); }
            50% { 
                transform: rotate(45deg) scale(1.25) translate(1px, -1px); 
                box-shadow: 0 0 40px #0284c7, 0 0 75px #2563eb, 0 0 110px #1d4ed8, inset 0 0 25px #ffffff;
            }
            75% { transform: rotate(45deg) scale(1.15) translate(-1px, -1px); }
        }

        .effect-fire {
            animation: fire-flare 0.5s infinite ease-in-out !important;
            background: linear-gradient(135deg, #ef4444, #ea580c, #fde047) !important;
            border-color: #fef08a !important;
        }

        .effect-electric {
            animation: electric-zap 0.35s infinite ease-in-out !important;
            background: linear-gradient(135deg, #06b6d4, #2563eb, #ffffff) !important;
            border-color: #e0f2fe !important;
        }

        /* Slider Thumb styling */
        #slider-thumb {
            transition: transform 0.1s;
        }
        #slider-thumb.snapping {
            transition: left 0.3s ease-out, transform 0.3s ease-out;
        }

        /* Redesigned Text Glows */
        .text-shadow-glow-red { text-shadow: 0 0 16px rgba(239, 68, 68, 1), 0 0 30px rgba(220, 38, 38, 0.8); }
        .text-shadow-glow-cyan { text-shadow: 0 0 16px rgba(6, 182, 212, 1), 0 0 30px rgba(37, 99, 235, 0.8); }
        .text-shadow-cinematic { text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- PHASE 1: STORY DIALOGUE SCREEN -->
    <div id="storyScreen" class="absolute inset-0 z-30 flex flex-col justify-end bg-cover bg-center bg-no-repeat cursor-pointer transition-opacity duration-700" 
         style="background-image: url('https://res.cloudinary.com/dsqi4tm8x/image/upload/v1790269644/2fea2de11dc79970adf05c7a86a1ab97_armfj4.jpg'); transform: translateY(-10%);">
        
        <!-- Subtle gradient for text readability -->
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent pointer-events-none"></div>

        <!-- Transparent Dialog Box (No Borders) -->
        <div class="relative z-10 w-full px-6 pb-12 pt-6 transparent-dialog">
            <div class="max-w-3xl mx-auto text-center">
                <h3 id="dialogSpeaker" class="font-title font-bold text-red-400 text-lg tracking-widest uppercase mb-2">Narrator</h3>
                <p id="dialogText" class="text-white text-xl md:text-2xl leading-relaxed min-h-[90px] drop-shadow-md">
                    <!-- Text injected via JS -->
                </p>
                
                <!-- Tap Indicator -->
                <p class="text-xs text-gray-400 tracking-widest uppercase mt-6 animate-pulse-soft">
                    Tap anywhere to continue
                </p>
            </div>
        </div>
    </div>

    <!-- TRANSITION OVERLAY BETWEEN VIDEO 1.0 & 1.1 -->
    <div id="transitionScreen" class="absolute inset-0 z-50 hidden flex flex-col items-center justify-center bg-black cursor-pointer transition-opacity duration-700">
        <div class="px-6 text-center">
            <h2 class="font-title text-2xl md:text-4xl text-white font-extrabold tracking-[0.25em] uppercase text-shadow-cinematic animate-pulse">
                And then... I arrived.
            </h2>
            <p class="text-xs text-gray-500 tracking-widest uppercase mt-8 animate-pulse-soft">
                Tap to skip
            </p>
        </div>
    </div>

    <!-- PHASE 2: FULLSCREEN VIDEO PLAYER (HTML5 & YT) -->
    <div id="videoScreen" class="absolute inset-0 z-20 hidden bg-black">
        <div class="video-layer">
            <!-- HTML5 Video for 1.0 and 1.1 -->
            <video id="mainVideo" playsinline preload="auto"></video>
            
            <!-- YouTube Player Container for 1.2 -->
            <div id="ytPlayerContainer" class="hidden w-full h-full absolute inset-0">
                <div id="ytPlayer"></div>
            </div>
        </div>
        
        <!-- Hidden skip instruction if autoplay is blocked -->
        <div id="playPrompt" class="absolute inset-0 z-30 hidden flex items-center justify-center bg-black/80 cursor-pointer">
            <p class="text-white font-title text-xl tracking-widest animate-pulse-soft">Tap to Start Video</p>
        </div>
    </div>

    <!-- PHASE 3: ELEMENTAL POWER SLIDER OVERLAY (No black box, 100% Transparent background) -->
    <div id="powerChoiceScreen" class="absolute inset-x-0 z-40 hidden flex-col items-center pointer-events-none" style="bottom: 20%;">
        
        <!-- Transparent Drag Track Overlay -->
        <div class="relative w-full max-w-md h-20 flex items-center justify-center overflow-visible pointer-events-auto px-4">
            
            <!-- Glowing Target Labels floating cleanly over video -->
            <div class="absolute left-4 text-red-500 font-title font-black tracking-widest text-lg md:text-xl text-shadow-glow-red flex items-center gap-1">
                <svg class="w-5 h-5 fill-red-500 animate-pulse" viewBox="0 0 24 24"><path d="M12 23c-4.97 0-9-3.58-9-8 0-4.19 3.48-8.22 6.54-11.28.39-.39 1.02-.39 1.41 0C12.36 5.12 18 9.57 18 15c0 4.42-3.58 8-8 8z"/></svg>
                FIRE
            </div>
            
            <div class="absolute right-4 text-cyan-400 font-title font-black tracking-widest text-lg md:text-xl text-shadow-glow-cyan flex items-center gap-1">
                ELECTRIC
                <svg class="w-5 h-5 fill-cyan-400 animate-pulse" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
            </div>
            
            <!-- Central Track Bar Line (No solid black box container) -->
            <div class="w-full h-1.5 bg-gradient-to-r from-red-600/70 via-gray-400/40 to-cyan-500/70 rounded-full shadow-[0_0_10px_rgba(255,255,255,0.3)]"></div>
            
            <!-- Center Neutral Marker -->
            <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 w-1.5 h-6 bg-white/60 rounded-full shadow-[0_0_8px_#ffffff]"></div>
            
            <!-- Draggable Diamond Thumb Container -->
            <div id="slider-thumb" class="absolute w-16 h-16 flex items-center justify-center cursor-grab snapping" style="left: 50%; transform: translateX(-50%); z-index: 10;">
                <!-- Diamond Visual Core with Adaptive Fire / Electric FX -->
                <div id="thumb-visual" class="w-10 h-10 bg-gray-200 border-2 border-white transform rotate-45 transition-all duration-150 shadow-2xl flex items-center justify-center">
                    <!-- Inner Elemental Emblem Icon -->
                    <div id="thumb-icon" class="transform -rotate-45 transition-transform duration-200">
                        <svg id="icon-neutral" class="w-5 h-5 fill-gray-800" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                        <svg id="icon-fire" class="w-6 h-6 fill-amber-100 hidden" viewBox="0 0 24 24"><path d="M13.5 12.09c-.38.25-.83.51-1.3.75-1.55.79-3.2 1.16-4.7 1.16-1.9 0-3.5-.6-4.5-1.7-.5-.5-.8-1.1-.8-1.7 0-1.3 1.28-2.5 2.88-2.5.85 0 1.6.3 2.2.78.33.28.63.6.87.96.13.19.27.36.42.51.15.15.3.28.45.4.36.27.77.4 1.2.4.56 0 1.08-.2 1.5-.56l-.05-.05c-.56-.57-1.3-.9-2.1-.9-1.44 0-2.65 1.1-2.65 2.5 0 1.05.58 1.95 1.42 2.37.36.18.76.28 1.18.28 1.12 0 2.1-.56 2.73-1.4.24-.32.45-.68.6-1.07.2-.52.35-1.1.38-1.71.03-.65-.08-1.27-.33-1.85z"/></svg>
                        <svg id="icon-electric" class="w-6 h-6 fill-white hidden" viewBox="0 0 24 24"><path d="M11 15H6l7-14v8h5l-7 14v-8z"/></svg>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Media Configuration
        const bgImage = 'https://res.cloudinary.com/dsqi4tm8x/image/upload/v1790269644/2fea2de11dc79970adf05c7a86a1ab97_armfj4.jpg';
        
        // Extracted raw .mp4 URLs for borderless playback
        const video1_0 = 'https://res.cloudinary.com/dsqi4tm8x/video/upload/1.0_edoutw.mp4';
        const video1_1 = 'https://res.cloudinary.com/dsqi4tm8x/video/upload/1.1_b4lyr8.mp4';

        // YouTube Video IDs for 1.2
        const ytFireId = 'F4FEpI-0tzI';
        const ytElectricId = 'VXtbzPW48G0';

        // YouTube API Setup
        let ytPlayerInstance;
        let isYtReady = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            ytPlayerInstance = new YT.Player('ytPlayer', {
                playerVars: {
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'playsinline': 1,
                    'autoplay': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': () => { isYtReady = true; },
                    'onStateChange': (event) => {
                        // When Video 1.2 (YT) finishes, trigger the epilogue dialogue
                        if (event.data === YT.PlayerState.ENDED) {
                            startEpilogue();
                        }
                    }
                }
            });
        };

        // English Story Dialogues (Phase 1 - Prologue)
        const storyDialogues = [
            { speaker: "Narrator", text: "Evil shadow ninjas have emerged from the darkness..." },
            { speaker: "Villager", text: "They are terrorizing the innocent and burning everything in their path!" },
            { speaker: "Hero", text: "I must awaken the ancient elemental powers to stop this madness." }
        ];

        // English Story Dialogues (Phase 4 - Epilogue)
        const epilogueDialogues = [
            { speaker: "Hero", text: "Yes, we finally win!" },
            { speaker: "Hero", text: "Now let's go fight another ninja..." }
        ];

        let currentStoryIndex = 0;
        let isEpiloguePhase = false;
        let currentVideoPhase = '';
        let transitionTimer = null;

        // DOM Elements
        const storyScreen = document.getElementById('storyScreen');
        const transitionScreen = document.getElementById('transitionScreen');
        const dialogSpeaker = document.getElementById('dialogSpeaker');
        const dialogText = document.getElementById('dialogText');
        const videoScreen = document.getElementById('videoScreen');
        const mainVideo = document.getElementById('mainVideo');
        const playPrompt = document.getElementById('playPrompt');
        const powerChoiceScreen = document.getElementById('powerChoiceScreen');

        // Start epilogue after video 1.2 completes
        function startEpilogue() {
            videoScreen.classList.add('hidden');
            document.getElementById('ytPlayerContainer').classList.add('hidden');
            
            isEpiloguePhase = true;
            currentStoryIndex = 0;
            updateDialogue();
            
            storyScreen.classList.remove('hidden');
            setTimeout(() => {
                storyScreen.classList.remove('opacity-0');
            }, 50);
        }

        function updateDialogue() {
            const dialogues = isEpiloguePhase ? epilogueDialogues : storyDialogues;
            const dialogue = dialogues[currentStoryIndex];
            dialogSpeaker.innerText = dialogue.speaker;
            dialogText.innerText = dialogue.text;
        }

        // Tap story screen to advance dialogue
        storyScreen.addEventListener('click', () => {
            const dialogues = isEpiloguePhase ? epilogueDialogues : storyDialogues;
            currentStoryIndex++;
            
            if (currentStoryIndex < dialogues.length) {
                updateDialogue();
            } else {
                if (!isEpiloguePhase) {
                    storyScreen.classList.add('opacity-0');
                    setTimeout(() => {
                        storyScreen.classList.add('hidden');
                        playVideo('1.0');
                    }, 700);
                } else {
                    dialogSpeaker.innerText = "System";
                    dialogText.innerText = "To Be Continued...";
                    const pulsePrompt = storyScreen.querySelector('.animate-pulse-soft');
                    if (pulsePrompt) pulsePrompt.classList.add('hidden');
                }
            }
        });

        // Initialize prologue text
        updateDialogue();

        function playVideo(phase) {
            videoScreen.classList.remove('hidden');
            currentVideoPhase = phase;
            
            mainVideo.classList.remove('hidden');
            document.getElementById('ytPlayerContainer').classList.add('hidden');

            if (phase === '1.0') {
                mainVideo.src = video1_0;
            } else if (phase === '1.1') {
                mainVideo.src = video1_1;
            }

            const playPromise = mainVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    playPrompt.classList.remove('hidden');
                });
            }
        }

        playPrompt.addEventListener('click', () => {
            playPrompt.classList.add('hidden');
            mainVideo.play();
        });

        // Trigger cinematic narrator screen between 1.0 and 1.1
        function showNarratorTransition() {
            transitionScreen.classList.remove('hidden');
            transitionScreen.classList.remove('opacity-0');

            // Auto advance after 2.5 seconds or on tap
            transitionTimer = setTimeout(() => {
                hideNarratorTransition();
            }, 2500);
        }

        function hideNarratorTransition() {
            if (transitionTimer) clearTimeout(transitionTimer);
            transitionScreen.classList.add('opacity-0');
            setTimeout(() => {
                transitionScreen.classList.add('hidden');
                playVideo('1.1');
            }, 500);
        }

        transitionScreen.addEventListener('click', hideNarratorTransition);

        // Listen for video completion
        mainVideo.addEventListener('ended', () => {
            if (currentVideoPhase === '1.0') {
                // Show transition overlay: "And then... I arrived."
                showNarratorTransition();
            } else if (currentVideoPhase === '1.1') {
                // Video 1.1 finished -> display transparent slider overlay
                powerChoiceScreen.classList.remove('hidden');
                powerChoiceScreen.classList.add('flex');
                resetSlider();
            }
        });

        const sliderContainer = powerChoiceScreen.querySelector('.max-w-md');
        const sliderThumb = document.getElementById('slider-thumb');
        const thumbVisual = document.getElementById('thumb-visual');
        const iconNeutral = document.getElementById('icon-neutral');
        const iconFire = document.getElementById('icon-fire');
        const iconElectric = document.getElementById('icon-electric');
        
        let isDragging = false;
        let startX = 0;
        let currentX = 50;
        let containerWidth = 0;

        function resetSlider() {
            sliderThumb.style.left = '50%';
            thumbVisual.className = "w-10 h-10 bg-gray-200 border-2 border-white transform rotate-45 transition-all duration-150 shadow-2xl flex items-center justify-center";
            
            iconNeutral.classList.remove('hidden');
            iconFire.classList.add('hidden');
            iconElectric.classList.add('hidden');
            currentX = 50;
        }

        function handleDragStart(e) {
            isDragging = true;
            sliderThumb.classList.remove('snapping');
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            containerWidth = sliderContainer.offsetWidth;
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const deltaX = clientX - startX;
            
            let percent = 50 + ((deltaX / containerWidth) * 100);
            percent = Math.max(10, Math.min(90, percent)); // Clamp between 10% and 90%
            
            sliderThumb.style.left = `${percent}%`;

            // Apply vibrant Fire or Electric styling based on drag percentage
            if (percent < 35) {
                // FIRE EFFECT
                thumbVisual.className = "w-10 h-10 transform rotate-45 transition-all duration-150 flex items-center justify-center effect-fire border-2";
                iconNeutral.classList.add('hidden');
                iconFire.classList.remove('hidden');
                iconElectric.classList.add('hidden');
            } else if (percent > 65) {
                // ELECTRIC EFFECT
                thumbVisual.className = "w-10 h-10 transform rotate-45 transition-all duration-150 flex items-center justify-center effect-electric border-2";
                iconNeutral.classList.add('hidden');
                iconFire.classList.add('hidden');
                iconElectric.classList.remove('hidden');
            } else {
                // NEUTRAL STATE
                thumbVisual.className = "w-10 h-10 bg-gray-200 border-2 border-white transform rotate-45 transition-all duration-150 shadow-2xl flex items-center justify-center";
                iconNeutral.classList.remove('hidden');
                iconFire.classList.add('hidden');
                iconElectric.classList.add('hidden');
            }
            
            currentX = percent;
        }

        function handleDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            sliderThumb.classList.add('snapping');
            
            if (currentX <= 20) {
                selectPower('fire');
            } else if (currentX >= 80) {
                selectPower('electric');
            } else {
                resetSlider();
            }
        }

        function selectPower(type) {
            powerChoiceScreen.classList.add('hidden');
            powerChoiceScreen.classList.remove('flex');
            
            mainVideo.classList.add('hidden');
            document.getElementById('ytPlayerContainer').classList.remove('hidden');

            const targetVideoId = type === 'fire' ? ytFireId : ytElectricId;

            if (isYtReady && ytPlayerInstance) {
                ytPlayerInstance.loadVideoById(targetVideoId);
                ytPlayerInstance.playVideo();
            } else {
                const retryPlay = setInterval(() => {
                    if (isYtReady && ytPlayerInstance) {
                        ytPlayerInstance.loadVideoById(targetVideoId);
                        ytPlayerInstance.playVideo();
                        clearInterval(retryPlay);
                    }
                }, 400);
            }
        }

        // Event Listeners for Dragging
        sliderThumb.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);

        sliderThumb.addEventListener('touchstart', handleDragStart, { passive: false });
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);

    </script>
</body>
</html>
