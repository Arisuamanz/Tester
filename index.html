<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemain Video Skrin Penuh Auto Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Memastikan elemen video/iframe memenuhi keseluruhan skrin (stretch/fill) */
        .video-container iframe {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden min-h-screen flex items-center justify-center font-sans">

    <!-- Bekas Utama Skrin Penuh (Hidden asal, muncul selepas butang ditekan) -->
    <div id="player-container" class="video-container fixed inset-0 w-full h-full bg-black hidden z-50">
        <!-- API YouTube Iframe akan dimasukkan di sini -->
        <div id="youtube-player" class="w-full h-full"></div>
    </div>

    <!-- Butang Tunggal Di Tengah Skrin -->
    <div id="start-overlay" class="flex flex-col items-center justify-center z-10 text-center p-6">
        <button id="play-btn" onclick="startFullscreenVideo()" class="group relative inline-flex items-center justify-center px-10 py-6 text-xl font-extrabold text-white bg-gradient-to-r from-red-600 to-pink-600 rounded-full shadow-2xl hover:from-red-500 hover:to-pink-500 transition-all duration-300 transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-red-400">
            <svg class="w-8 h-8 mr-3 fill-current" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Tekan Untuk Main Fullscreen</span>
        </button>
        <p class="mt-4 text-gray-400 text-sm">Video akan diputar otomatis dalam mode layar penuh (Fill & Stretch)</p>
    </div>

    <!-- Muat Turun API YouTube Iframe -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        const videoId = 'wMONY5W8sZQ'; // ID Video YouTube yang diminta

        // Fungsi khas daripada API YouTube untuk pemulihan asas
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'playsinline': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            console.log("Pemain YouTube Siap.");
        }

        // Fungsi apabila butang ditekan
        function startFullscreenVideo() {
            const container = document.getElementById('player-container');
            const overlay = document.getElementById('start-overlay');

            // 1. Tunjukkan tetingkap video
            container.classList.remove('hidden');
            overlay.classList.add('hidden');

            // 2. Minta kebenaran Skrin Penuh (Fullscreen) pada pelayar
            if (container.requestFullscreen) {
                container.requestFullscreen().catch(err => console.log(err));
            } else if (container.webkitRequestFullscreen) { /* Safari / Webkit */
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) { /* IE11 */
                container.msRequestFullscreen();
            }

            // 3. Mainkan video secara automatik
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        }

        // Apabila pengguna keluar dari mod Fullscreen secara manual, tunjukkan butang semula
        document.addEventListener('fullscreenchange', exitHandler);
        document.addEventListener('webkitfullscreenchange', exitHandler);
        document.addEventListener('mozfullscreenchange', exitHandler);
        document.addEventListener('MSFullscreenChange', exitHandler);

        function exitHandler() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen && !document.mozFullScreen && !document.msFullscreenElement) {
                const container = document.getElementById('player-container');
                const overlay = document.getElementById('start-overlay');
                
                container.classList.add('hidden');
                overlay.classList.remove('hidden');
                
                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
            }
        }
    </script>
</body>
</html>
